# =========================================================================
# CONFIGURACAO PRINCIPAL - SISTEMA DE MOEDA ESTUDANTIL (SPRINT 3)
# =========================================================================
spring.application.name=sistema-moeda-estudantil
server.port=8080

# -------------------------------------------------------------------------
# BANCO DE DADOS POSTGRESQL (Padrao: localhost:5432/moeda_estudantil)
# Obs: Para rodar em banco local em arquivo (sem precisar do Postgres/Docker
# ligado), basta iniciar com: mvn spring-boot:run -Dspring-boot.run.profiles=local
# -------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/moeda_estudantil}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (ORM)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Serve arquivos estaticos direto de src/main/resources/static sem cache
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0

# -------------------------------------------------------------------------
# E-MAIL (RN06 e RN10) - Padrao: Mailpit do docker-compose (SMTP localhost:1025,
# caixa de entrada em http://localhost:8025). Para um SMTP real (ex.: Gmail),
# defina MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_SMTP_AUTH=true
# e MAIL_STARTTLS=true. Sem servidor SMTP, o conteudo do e-mail vai para o log.
# -------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
app.email.remetente=${MAIL_FROM:nao-responda@moedaestudantil.pucminas.br}
app.email.habilitado=${MAIL_ENABLED:true}

# Pasta onde ficam as fotos das vantagens (servidas em /uploads/**)
app.uploads.dir=${UPLOADS_DIR:uploads}
