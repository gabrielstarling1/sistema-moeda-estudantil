<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato | Moeda Estudantil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/css/styles.css?v=5">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main">
            <div class="container">
                <header class="page-header">
                    <div>
                        <p class="eyebrow">Conta</p>
                        <h1>Extrato</h1>
                        <p class="page-desc" id="extratoDescricao"></p>
                    </div>
                </header>

                <div class="stack">
                    <div class="grid-3" id="extratoIndicadores"></div>

                    <section class="card">
                        <div class="toolbar">
                            <h2 class="card-title">Movimentações</h2>
                            <div class="segmented hidden" id="filtroTipo" role="group" aria-label="Filtrar movimentações">
                                <button type="button" class="active" data-filtro="todas">Todas</button>
                                <button type="button" data-filtro="entradas">Entradas</button>
                                <button type="button" data-filtro="saidas">Trocas</button>
                            </div>
                        </div>
                        <div class="table-wrap">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Data</th>
                                        <th>Descrição</th>
                                        <th id="colContraparte">Origem</th>
                                        <th>Cupom</th>
                                        <th class="right">Moedas</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaExtrato"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js?v=5"></script>
    <script src="/js/layout.js?v=5"></script>
    <script src="/js/extrato.js?v=5"></script>
</body>
</html>
