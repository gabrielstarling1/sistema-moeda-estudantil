# =========================================================================
# PERFIL LOCAL (Banco em Arquivo compativel com PostgreSQL - Zero Config)
# Ative com: mvn spring-boot:run -Dspring-boot.run.profiles=local
# =========================================================================
spring.datasource.url=jdbc:h2:file:./data/moeda_estudantil_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
