version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moeda_estudantil_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: moeda_estudantil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.20.0
    container_name: moeda_estudantil_mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP usado pela aplicacao
      - "8025:8025"   # Caixa de entrada: http://localhost:8025

volumes:
  postgres_data:
